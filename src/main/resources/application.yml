spring:
  config:
    import: optional:file:.env[.properties]   
  application:
    name: enterprise-rag
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ragdb}
    username: ${DB_USER:rag}
    password: ${DB_PASSWORD:rag}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: false        # schema is owned by Flyway (V1__init.sql)
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768                 # must match the embedding model
        max-document-batch-size: 1000
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always   # creates SPRING_AI_CHAT_MEMORY if missing
      observations:
        log-prompt: false
        log-completion: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  rag:
    chunk-size: 800
    min-chunk-size-chars: 350
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
    top-k: 6
    similarity-threshold: 0.45
    query-rewrite: false
    memory-window: 20
  security:
    api-key: ${APP_API_KEY:}

logging:
  level:
    org.springframework.ai.chat.client.advisor: INFO
